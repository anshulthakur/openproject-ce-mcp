services:
  openproject-ce-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: openproject-ce-mcp:latest
    container_name: openproject-ce-mcp
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, urllib.request; port = os.environ.get('PORT', '8000'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
